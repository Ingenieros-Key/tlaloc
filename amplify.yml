# Hosts the static under-construction page (landing/) for now.
# The Next.js app in frontend/ comes later — when ready, swap this for the
# frontend build spec (see docs/runbooks/amplify-hosting.md, "frontend app" section).
version: 1
frontend:
  phases:
    build:
      commands: []
  artifacts:
    baseDirectory: landing
    files:
      - "**/*"
  cache:
    paths: []
