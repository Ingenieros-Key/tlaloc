<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="Cargando" xmlns:c2pa="http://c2pa.org/manifest">
<style>
/* Tlaloc loader, transparent background. Growth loop = 6s, spinner turn = 1.5s. Base styles are the final frame. */
.spin{transform-origin:100px 100px;animation:turn 1.5s linear infinite}
.seed{opacity:0;animation:seed 6s infinite}
.soil{transform-origin:100px 138px;animation:soil 6s infinite}
.drop{opacity:0;animation:rain 6s linear infinite}
.d2{animation-delay:.18s}.d3{animation-delay:.36s}
.plant{animation:life 6s infinite}
.stem{stroke-dasharray:1 3;stroke-dashoffset:0;animation:grow 6s infinite}
.p1{animation:pop1 6s infinite}.p2{animation:pop2 6s infinite}.p3{animation:pop3 6s infinite}.p4{animation:pop4 6s infinite}.p5{animation:pop5 6s infinite}.p6{animation:pop6 6s infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes seed{0%{transform:translateY(-70px);opacity:0;animation-timing-function:ease-in}3%{opacity:1}12%{transform:translateY(0);opacity:1}13%,100%{transform:translateY(0);opacity:0}}
@keyframes soil{0%,11%{transform:scale(1)}14%{transform:scale(1.05,.9)}18%,100%{transform:scale(1)}}
@keyframes rain{0%,15%{transform:translateY(0);opacity:0}16%{opacity:1}26%{transform:translateY(60px);opacity:1}27%{transform:translateY(60px);opacity:0}28%{transform:translateY(0);opacity:0}29%{opacity:1}39%{transform:translateY(60px);opacity:1}40%,100%{transform:translateY(60px);opacity:0}}
@keyframes life{0%,35%{opacity:0}36%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes grow{0%,36%{stroke-dashoffset:1.02}66%,100%{stroke-dashoffset:0}}
@keyframes pop1{0%,43%{transform:scale(0)}49%{transform:scale(1.1)}52%,100%{transform:scale(1)}}
@keyframes pop2{0%,49%{transform:scale(0)}55%{transform:scale(1.1)}58%,100%{transform:scale(1)}}
@keyframes pop3{0%,55%{transform:scale(0)}61%{transform:scale(1.1)}64%,100%{transform:scale(1)}}
@keyframes pop4{0%,61%{transform:scale(0)}67%{transform:scale(1.1)}70%,100%{transform:scale(1)}}
@keyframes pop5{0%,68%{transform:scale(0)}74%{transform:scale(1.15)}77%,100%{transform:scale(1)}}
@keyframes pop6{0%,75%{transform:scale(0)}81%{transform:scale(1.2)}84%,100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- spinner: faint track plus a turning arc -->
<circle cx="100" cy="100" r="80" fill="none" stroke="#1FC8B4" stroke-opacity=".22" stroke-width="6"/>
<path class="spin" d="M100 20A80 80 0 0 1 180 100" fill="none" stroke="#1FC8B4" stroke-width="6" stroke-linecap="round"/>
<!-- rain -->
<g fill="#1FC8B4">
<path class="drop" d="M78 48l2.8 9.5a2.9 2.9 0 0 1-5.6 0z"/>
<path class="drop d2" d="M100 42l2.8 9.5a2.9 2.9 0 0 1-5.6 0z"/>
<path class="drop d3" d="M122 48l2.8 9.5a2.9 2.9 0 0 1-5.6 0z"/>
</g>
<!-- seed and plant sit behind the soil, so the seed disappears into it and the stalk comes out of it -->
<g transform="translate(100 130)"><ellipse class="seed" rx="4.2" ry="5.6" fill="#F6B93B"/></g>
<g class="plant">
<!-- tassel -->
<g transform="translate(100 60)"><path class="p5" d="M0 0V-13M0 -1L-7 -10M0 -1L7 -10" fill="none" stroke="#F6B93B" stroke-width="3" stroke-linecap="round"/></g>
<path class="stem" pathLength="1" d="M100 130C99 108 101 84 100 60" fill="none" stroke="#5DBB63" stroke-width="6" stroke-linecap="round"/>
<!-- long arching leaves, alternating sides -->
<g fill="#5DBB63">
<g transform="translate(100 112)"><path class="p1" d="M0 0C4 -20 24 -28 40 -12C27 -18 13 -12 3 5Z"/></g>
<g transform="translate(100 102) scale(-1 1)"><path class="p2" d="M0 0C4 -20 24 -28 40 -12C27 -18 13 -12 3 5Z"/></g>
<g transform="translate(100 88) scale(.85)"><path class="p3" d="M0 0C4 -20 24 -28 40 -12C27 -18 13 -12 3 5Z"/></g>
<g transform="translate(100 78) scale(-.78 .78)"><path class="p4" d="M0 0C4 -20 24 -28 40 -12C27 -18 13 -12 3 5Z"/></g>
</g>
<!-- ear of corn -->
<g transform="translate(103 101) rotate(34)"><g class="p6"><ellipse cx="0" cy="-12" rx="6.6" ry="12.5" fill="#F6B93B"/><path d="M-6 0C-7 -8 -4 -12 0 -13C-1 -8 1 -3 6 0Z" fill="#5DBB63"/></g></g>
</g>
<!-- plot of land -->
<path class="soil" d="M58 138C62 118 138 118 142 138Z" fill="#E4572E" stroke="#E4572E" stroke-width="6" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
